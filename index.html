<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalog Product Scanner</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: white; margin: 0; padding: 15px; text-align: center; }
        .card-box { max-width: 480px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h2 { color: #38bdf8; margin-top: 0; margin-bottom: 15px; }
        .btn { display: inline-block; width: 100%; padding: 14px; font-size: 16px; font-weight: bold; color: white; background: #0284c7; border: none; border-radius: 8px; margin: 6px 0; cursor: pointer; box-sizing: border-box; }
        .btn-purple { background: #8b5cf6; }
        input[type="file"] { display: none; }
        canvas { display: none; }
        .divider { margin: 20px 0 15px 0; border-bottom: 1px solid #334155; position: relative; }
        .divider span { background: #1e293b; padding: 0 10px; color: #94a3b8; font-size: 13px; font-weight: bold; position: relative; top: -10px; }
        
        .variant-card { background: #0f172a; border-left: 5px solid #38bdf8; padding: 12px; text-align: left; margin-top: 10px; border-radius: 8px; }
        .price-tag { font-size: 20px; color: #4ade80; font-weight: bold; margin: 4px 0; }
        .badge { background: #0369a1; color: white; font-size: 11px; font-weight: bold; padding: 3px 8px; border-radius: 4px; display: inline-block; margin-right: 4px; }
        .finish-badge { background: #d97706; color: white; font-size: 11px; font-weight: bold; padding: 3px 8px; border-radius: 4px; display: inline-block; }
    </style>
</head>
<body>

<div class="card-box">
    <h2>Catalog Product Scanner</h2>
    
    <label class="btn btn-purple">
        📸 Snap Label / Barcode
        <input type="file" accept="image/*" capture="environment" id="fileInput" onchange="processUploadedPhoto()">
    </label>

    <canvas id="canvas"></canvas>

    <div class="divider">
        <span>OR MANUAL SKU LOOKUP</span>
    </div>

    <input type="text" id="manualSku" placeholder="Type CERA or ESSCO Code (e.g. S1013265VS, KIO-1110118)" style="width: 100%; padding: 12px; font-size: 16px; border: 1px solid #334155; background: #0f172a; color: white; border-radius: 8px; box-sizing: border-box;">
    <button class="btn" onclick="searchManual()">Search Code</button>

    <div id="output"></div>
</div>

<script>
const BACKEND_URL = "https://catalog-scanner-api.onrender.com"; // Your Render live backend URL

async function processUploadedPhoto() {
    const input = document.getElementById('fileInput');
    if (!input.files || !input.files[0]) return;

    const outputDiv = document.getElementById('output');
    outputDiv.innerHTML = "<p style='color:#38bdf8;'>Processing image...</p>";

    const img = new Image();
    img.src = URL.createObjectURL(input.files[0]);
    img.onload = async () => {
        const canvas = document.getElementById('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);

        outputDiv.innerHTML = "<p style='color:#38bdf8;'>Scanning barcode / text...</p>";
        runOcrAndSearch(canvas);
    };
}

async function runOcrAndSearch(canvas) {
    const outputDiv = document.getElementById('output');
    try {
        const worker = await Tesseract.createWorker('eng');
        const ret = await worker.recognize(canvas);
        await worker.terminate();

        const ocrText = ret.data.text;
        // Match CERA full codes or ESSCO barcode capital codes
        const skuPattern = /\b([A-Z0-9]{2,5}-[A-Z0-9-]{3,18}|[SFEABSP][0-9]{7,8}[A-Z0-9]*)\b/gi;
        const matches = ocrText.match(skuPattern);

        if (matches && matches.length > 0) {
            const detectedSku = matches[0].trim().toUpperCase();
            outputDiv.innerHTML = `<p style='color:#4ade80;'>Detected: <strong>${detectedSku}</strong>. Fetching all variants...</p>`;
            queryBackend(detectedSku);
        } else {
            outputDiv.innerHTML = "<p style='color:#f87171;'>No code detected. Position tag clearly in photo.</p>";
        }
    } catch (err) {
        outputDiv.innerHTML = "<p style='color:#f87171;'>OCR scan error. Try manual search below.</p>";
    }
}

async function searchManual() {
    const sku = document.getElementById('manualSku').value;
    if (!sku) return;
    queryBackend(sku.trim().toUpperCase());
}

async function queryBackend(skuQuery) {
    const outputDiv = document.getElementById('output');
    try {
        const res = await fetch(`${BACKEND_URL}/scan?sku=${encodeURIComponent(skuQuery)}`);
        if (!res.ok) throw new Error("Not Found");
        const data = await res.json();
        renderResult(data);
    } catch (e) {
        outputDiv.innerHTML = `<p style='color:#f87171;'>Product SKU '${skuQuery}' not found in database.</p>`;
    }
}

function renderResult(data) {
    const outputDiv = document.getElementById('output');
    if (data.status === "success" && data.products.length > 0) {
        let html = `<p style="color:#4ade80; margin-bottom:10px;">Found ${data.total_variants_found} Finish Variant(s) for '${data.searched_sku}'</p>`;
        
        data.products.forEach((p, idx) => {
            html += `
                <div class="variant-card">
                    <div>
                        <span class="badge">${p.brand}</span>
                        <span class="finish-badge">${p.finish_name} (${p.finish_code})</span>
                    </div>
                    <h3 style="margin: 6px 0; color:#38bdf8;">SKU: ${p.sku_cat_no}</h3>
                    <div class="price-tag">MRP: ${p.mrp_inr}</div>
                    <small style="color:#cbd5e1;">${p.description}</small><br>
                    <small style="color:#64748b;">Page ${p.page_no} (${p.source_catalog})</small>
                    ${idx === 0 ? '<br><span style="color:#4ade80; font-size:11px; font-weight:bold;">✅ Logged to Google Sheet</span>' : ''}
                </div>
            `;
        });
        
        outputDiv.innerHTML = html;
    }
}
</script>

</body>
</html>
