<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalog Product Scanner</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: white; margin: 0; padding: 15px; text-align: center; }
        .card-box { max-width: 480px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h2 { color: #38bdf8; margin-top: 0; }
        .btn { display: inline-block; width: 100%; padding: 14px; font-size: 16px; font-weight: bold; color: white; background: #0284c7; border: none; border-radius: 8px; margin: 6px 0; cursor: pointer; box-sizing: border-box; }
        .btn-green { background: #16a34a; }
        .btn-orange { background: #ea580c; }
        
        .video-box { position: relative; width: 100%; height: 280px; border-radius: 12px; overflow: hidden; background: #000; margin-top: 10px; display: none; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .focus-frame { position: absolute; top: 20%; left: 10%; right: 10%; bottom: 20%; border: 2px dashed #38bdf8; border-radius: 8px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.4); pointer-events: none; }
        canvas { display: none; }
        
        .result-card { background: #0f172a; border-left: 6px solid #16a34a; padding: 15px; text-align: left; margin-top: 15px; border-radius: 8px; }
        .price-tag { font-size: 24px; color: #4ade80; font-weight: bold; margin: 5px 0; }
        .badge { background: #0369a1; color: white; font-size: 11px; font-weight: bold; padding: 3px 8px; border-radius: 4px; display: inline-block; margin-right: 4px; }
    </style>
</head>
<body>

<div class="card-box">
    <h2>Catalog Product Scanner</h2>
    
    <div class="video-box" id="videoBox">
        <video id="webcam" autoplay playsinline></video>
        <div class="focus-frame"></div>
    </div>
    <canvas id="canvas"></canvas>

    <button id="camBtn" class="btn btn-green" onclick="startHDCamera()">📷 Start HD Camera</button>
    <button id="snapBtn" class="btn btn-orange" onclick="captureAndEnhance()" style="display:none;">🔍 Snap & Read High-Res Label</button>
    <button id="torchBtn" class="btn" onclick="toggleTorch()" style="display:none; background:#64748b;">💡 Toggle Flashlight</button>

    <p style="margin: 15px 0; color: #94a3b8;">— OR MANUAL SKU LOOKUP —</p>

    <input type="text" id="manualSku" placeholder="Type SKU (e.g. AEC-1111N, S1013265)" style="width: 100%; padding: 12px; font-size: 16px; border: 1px solid #334155; background: #0f172a; color: white; border-radius: 8px; box-sizing: border-box;">
    <button class="btn" onclick="searchManual()">Search Code</button>

    <div id="output"></div>
</div>

<script>
const BACKEND_URL = "https://catalog-scanner-api.onrender.com"; // Your Render live URL
let videoTrack = null;

async function startHDCamera() {
    const video = document.getElementById('webcam');
    const videoBox = document.getElementById('videoBox');
    const camBtn = document.getElementById('camBtn');
    const snapBtn = document.getElementById('snapBtn');
    const torchBtn = document.getElementById('torchBtn');
    const outputDiv = document.getElementById('output');

    try {
        // Request High Definition (1080p) stream with continuous focus
        const stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: { exact: "environment" },
                width: { ideal: 1920 },
                height: { ideal: 1080 },
                focusMode: { ideal: "continuous" }
            }
        }).catch(() => {
            // Fallback for devices without dual rear cameras
            return navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        });

        video.srcObject = stream;
        videoTrack = stream.getVideoTracks()[0];

        videoBox.style.display = "block";
        camBtn.style.display = "none";
        snapBtn.style.display = "block";
        torchBtn.style.display = "block";

        outputDiv.innerHTML = "<p style='color:#38bdf8;'>Align SKU code inside the dashed frame and tap Snap.</p>";
    } catch (err) {
        outputDiv.innerHTML = "<p style='color:#f87171;'>Camera access denied or high-res video unsupported.</p>";
    }
}

async function toggleTorch() {
    if (videoTrack && videoTrack.getCapabilities().torch) {
        const currentSetting = videoTrack.getSettings().torch;
        await videoTrack.applyConstraints({
            advanced: [{ torch: !currentSetting }]
        });
    } else {
        alert("Flashlight/Torch controls not supported by this browser sensor.");
    }
}

async function captureAndEnhance() {
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const outputDiv = document.getElementById('output');

    outputDiv.innerHTML = "<p style='color:#38bdf8;'>Processing high-res image & enhancing text contrast...</p>";

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    
    // 1. Draw raw video frame onto canvas
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    // 2. Pre-process Image: Convert to high-contrast Grayscale
    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const d = imgData.data;
    for (let i = 0; i < d.length; i += 4) {
        let v = (d[i] * 0.2126 + d[i+1] * 0.7152 + d[i+2] * 0.0722);
        // Simple Thresholding for crisp text
        v = v > 120 ? 255 : 0;
        d[i] = d[i+1] = d[i+2] = v;
    }
    ctx.putImageData(imgData, 0, 0);

    // 3. Run In-Browser OCR on enhanced image
    const worker = await Tesseract.createWorker('eng');
    const ret = await worker.recognize(canvas);
    await worker.terminate();

    const ocrText = ret.data.text;
    
    // Extract candidate SKUs
    const skuPattern = /\b([A-Z0-9]{2,5}-[A-Z0-9-]{3,18}|[SFEABSP][0-9]{7,8}[A-Z0-9]*)\b/gi;
    const matches = ocrText.match(skuPattern);

    if (matches && matches.length > 0) {
        const detectedSku = matches[0].trim().toUpperCase();
        outputDiv.innerHTML = `<p style='color:#4ade80;'>Detected Code: <strong>${detectedSku}</strong>. Fetching pricing...</p>`;
        queryBackend(detectedSku);
    } else {
        outputDiv.innerHTML = "<p style='color:#f87171;'>Could not read code clearly. Turn on Flashlight or hold closer.</p>";
    }
}

async function searchManual() {
    const sku = document.getElementById('manualSku').value;
    if (!sku) return;
    queryBackend(sku.trim().toUpperCase());
}

async function queryBackend(skuQuery) {
    const outputDiv = document.getElementById('output');
    try {
        const res = await fetch(`${BACKEND_URL}/scan?sku=${encodeURIComponent(skuQuery)}`);
        if (!res.ok) throw new Error("Not Found");
        const data = await res.json();
        renderResult(data);
    } catch (e) {
        outputDiv.innerHTML = `<p style='color:#f87171;'>Product SKU '${skuQuery}' not found in database.</p>`;
    }
}

function renderResult(data) {
    const outputDiv = document.getElementById('output');
    if (data.status === "success" && data.products.length > 0) {
        const p = data.products[0];
        outputDiv.innerHTML = `
            <div class="result-card">
                <div>
                    <span class="badge">${p.brand}</span>
                    <span class="badge">${p.category}</span>
                </div>
                <h3 style="margin: 8px 0; color:#38bdf8;">SKU: ${p.sku_cat_no}</h3>
                <div class="price-tag">MRP: ${p.mrp_inr}</div>
                <p style="color:#cbd5e1;"><strong>Specs:</strong> ${p.description}</p>
                <small style="color:#64748b;">Source: ${p.source_catalog} (Page ${p.page_no})</small><br>
                <p style="color:#4ade80; font-size:12px; font-weight:bold; margin-top:8px;">✅ Logged to Google Sheet</p>
            </div>
        `;
    }
}
</script>

</body>
</html>
    <p style="margin: 15px 0; color: #94a3b8;">— OR MANUAL SKU LOOKUP —</p>

    <input type="text" id="manualSku" placeholder="Type SKU (e.g. AEC-1111N, S1013265)" style="width: 100%; padding: 12px; font-size: 16px; border: 1px solid #334155; background: #0f172a; color: white; border-radius: 8px; box-sizing: border-box;">
    <button class="btn" onclick="searchManual()">Search Code</button>

    <div id="output"></div>
</div>

<script>
const BACKEND_URL = "https://catalog-scanner-api.onrender.com"; // Replace with your Render URL
let codeReader = null;

async function startScanner() {
    const videoBox = document.getElementById('videoBox');
    const camBtn = document.getElementById('camBtn');
    const outputDiv = document.getElementById('output');

    videoBox.style.display = "block";
    camBtn.style.display = "none";
    outputDiv.innerHTML = "<p style='color:#38bdf8;'>Align product barcode or label inside the laser line...</p>";

    codeReader = new ZXing.BrowserMultiFormatReader();
    try {
        const videoInputDevices = await codeReader.listVideoInputDevices();
        const selectedDeviceId = videoInputDevices.length > 1 ? videoInputDevices[1].deviceId : videoInputDevices[0].deviceId;

        codeReader.decodeFromVideoDevice(selectedDeviceId, 'video', (result, err) => {
            if (result) {
                const scannedText = result.text.trim().toUpperCase();
                outputDiv.innerHTML = `<p style='color:#4ade80;'>Scanned Code: <strong>${scannedText}</strong>. Searching database...</p>`;
                queryBackend(scannedText);
            }
        });
    } catch (err) {
        outputDiv.innerHTML = "<p style='color:#f87171;'>Camera permission required or camera busy.</p>";
    }
}

async function searchManual() {
    const sku = document.getElementById('manualSku').value;
    if (!sku) return;
    queryBackend(sku.trim().toUpperCase());
}

async function queryBackend(skuQuery) {
    const outputDiv = document.getElementById('output');
    try {
        const res = await fetch(`${BACKEND_URL}/scan?sku=${encodeURIComponent(skuQuery)}`);
        if (!res.ok) throw new Error("Not Found");
        const data = await res.json();
        renderResult(data);
    } catch (e) {
        outputDiv.innerHTML = `<p style='color:#f87171;'>Product SKU '${skuQuery}' not found in database.</p>`;
    }
}

function renderResult(data) {
    const outputDiv = document.getElementById('output');
    if (data.status === "success" && data.products.length > 0) {
        const p = data.products[0];
        outputDiv.innerHTML = `
            <div class="result-card">
                <div>
                    <span class="badge">${p.brand}</span>
                    <span class="badge">${p.category}</span>
                </div>
                <h3 style="margin: 8px 0; color:#38bdf8;">SKU: ${p.sku_cat_no}</h3>
                <div class="price-tag">MRP: ${p.mrp_inr}</div>
                <p style="color:#cbd5e1;"><strong>Specs:</strong> ${p.description}</p>
                <small style="color:#64748b;">Source: ${p.source_catalog} (Page ${p.page_no})</small><br>
                <p style="color:#4ade80; font-size:12px; font-weight:bold; margin-top:8px;">✅ Logged to Google Sheet</p>
            </div>
        `;
    }
}
</script>

</body>
</html>
